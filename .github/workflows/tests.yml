# Action references are pinned; Dependabot proposes updates.
name: CI
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version-file: go.mod
    - run: go vet ./...
    - run: go test -race ./...
    - run: go build -o /tmp/arb-finder ./cmd/arb-finder
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
    - name: Build image without publishing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: Dockerfile
        push: false
        cache-from: type=gha,scope=${{ github.job }}-default
        cache-to: type=gha,mode=max,scope=${{ github.job }}-default
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 37 4 * * 1
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
